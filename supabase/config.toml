# Local development only. This file does not configure the hosted project.
project_id = "mednerds"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:4321"
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

# No production SMTP, CAPTCHA secrets or database passwords here.
